server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/TollPlazaLocater

    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update     

    show-sql: true
    properties:
       hibernate:
          format_sql: true

ors:
  api:
     key: ${ORS_API_KEY}