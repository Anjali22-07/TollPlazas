server:
  port: ${PORT:8080}

ors:
  api:
    key: ${ORS_API_KEY}

spring:
  datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5


  jpa:
      hibernate:
        ddl-auto: update
      properties:
       hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect